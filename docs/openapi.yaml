openapi: 3.0.3
info:
  title: Task Manager Application API
  version: 1.0.0
  description: RESTful API for Agile Task Manager Application.
paths:
  /api/health:
    get:
      summary: Health check endpoint
      description: Returns service status.
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              example:
                status: "ok"
                service: "task-manager-api"

  /api/ready:
    get:
      summary: Readiness check endpoint
      description: Checks database connectivity.
      responses:
        '200':
          description: Service ready
        '503':
          description: Service unavailable

  /api/auth/csrf:
    get:
      summary: Retrieve CSRF token
      description: Generates a CSRF token to be included in X-CSRFToken header.
      responses:
        '200':
          description: CSRF token successfully retrieved

  /api/auth/login:
    post:
      summary: Authenticate user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
      responses:
        '200':
          description: Successful authentication
        '401':
          description: Invalid credentials

  /api/auth/logout:
    post:
      summary: End session
      responses:
        '200':
          description: Session cleared

  /api/auth/me:
    get:
      summary: Get current authenticated user
      responses:
        '200':
          description: User object
        '401':
          description: Unauthenticated

  /api/auth/register:
    post:
      summary: Register account (Scope-Pending)
      responses:
        '501':
          description: Feature pending approval

  /api/tasks:
    get:
      summary: List authenticated user's tasks with filtering/search
      parameters:
        - name: q
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema: { type: string, enum: [pending, in_progress, completed] }
        - name: priority
          in: query
          schema: { type: string, enum: [low, medium, high] }
        - name: category_id
          in: query
          schema: { type: integer }
        - name: due_date_from
          in: query
          schema: { type: string, format: date }
        - name: due_date_to
          in: query
          schema: { type: string, format: date }
        - name: overdue
          in: query
          schema: { type: string, enum: ['true', 'false'] }
        - name: sort_by
          in: query
          schema: { type: string, enum: [created_at, updated_at, due_date, priority, status, title] }
        - name: order
          in: query
          schema: { type: string, enum: [asc, desc] }
      responses:
        '200':
          description: List of tasks
        '401':
          description: Unauthenticated

    post:
      summary: Create new task
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title: { type: string, maxLength: 200 }
                description: { type: string }
                priority: { type: string, enum: [low, medium, high] }
                status: { type: string, enum: [pending, in_progress, completed] }
                due_date: { type: string, format: date }
                category_id: { type: integer, nullable: true }
      responses:
        '201':
          description: Task created
        '400':
          description: Validation error
        '401':
          description: Unauthenticated

  /api/tasks/{taskId}:
    get:
      summary: Get task details
      parameters:
        - name: taskId
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Task details
        '404':
          description: Task not found or not owned

    patch:
      summary: Update task
      parameters:
        - name: taskId
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Task updated
        '404':
          description: Not found

    delete:
      summary: Delete task
      parameters:
        - name: taskId
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Task deleted
        '404':
          description: Not found

  /api/categories:
    get:
      summary: List user categories
      responses:
        '200':
          description: List of categories
    post:
      summary: Create category (Scope-Pending)
      responses:
        '501':
          description: Scope pending

  /api/dashboard/summary:
    get:
      summary: Get task counts summary for dashboard
      responses:
        '200':
          description: Counts of pending, in_progress, completed

  /api/notifications:
    get:
      summary: List notifications for the authenticated user
      description: Returns only notifications owned by the current session user, newest first. Uses the standard success response envelope.
      responses:
        '200':
          description: Notifications retrieved
          content:
            application/json:
              schema:
                type: object
                required: [success, data, message]
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string, example: Notifications retrieved }
                  data:
                    type: array
                    items:
                      type: object
                      required: [id, user_id, message, status]
                      properties:
                        id: { type: integer }
                        user_id: { type: integer }
                        task_id: { type: integer, nullable: true }
                        message: { type: string, maxLength: 512 }
                        scheduled_at: { type: string, format: date-time, nullable: true }
                        delivered_at: { type: string, format: date-time, nullable: true }
                        status: { type: string, enum: [pending, delivered, read, failed] }
                        created_at: { type: string, format: date-time, nullable: true }
        '401':
          description: Unauthenticated

  /api/notifications/{notificationId}/read:
    patch:
      summary: Mark an owned notification as read
      description: Changes the authenticated user's notification status to read. Notifications belonging to other users return 404.
      parameters:
        - name: notificationId
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Notification marked as read
        '401':
          description: Unauthenticated
        '404':
          description: Notification not found or not owned by the current user

  /api/admin/users:
    get:
      summary: List all users (Admin only)
      responses:
        '200':
          description: List of users
        '403':
          description: Forbidden - admin required
