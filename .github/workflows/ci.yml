name: CI Pipeline

on:
  push:
    branches: [main, 'feature/**', 'fix/**', 'test/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend-lint:
    name: backend-lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: server/requirements-dev.txt

      - name: Install backend dependencies
        run: python -m pip install -r server/requirements-dev.txt

      - name: Run Ruff
        run: ruff check server/

  backend-tests:
    name: backend-tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: server/requirements-dev.txt

      - name: Install backend dependencies
        run: python -m pip install -r server/requirements-dev.txt

      - name: Run Pytest with coverage
        working-directory: server
        run: |
          python -m pytest \
            --cov=app \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --junitxml=junit.xml

      - name: Upload backend test reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-reports
          path: |
            server/junit.xml
            server/coverage.xml
          if-no-files-found: warn

  frontend:
    name: frontend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        working-directory: client
        run: npm ci

      - name: Run ESLint
        working-directory: client
        run: npm run lint

      - name: Run Vitest
        working-directory: client
        run: npm test

      - name: Production build
        working-directory: client
        run: npm run build

  e2e:
    name: e2e
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: server/requirements-dev.txt

      - name: Install backend dependencies
        run: python -m pip install -r server/requirements-dev.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install frontend dependencies for the E2E web server
        working-directory: client
        run: npm ci

      - name: Install Playwright test dependencies
        working-directory: tests
        run: npm install --no-audit --no-fund

      - name: Install Chromium browser
        working-directory: tests
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E tests
        working-directory: tests
        run: npm test

      - name: Upload Playwright reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-e2e-reports
          path: |
            tests/playwright-report/
            tests/test-results/
          if-no-files-found: warn

  pending-tests:
    name: pending-tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check pending test placeholders
        run: python scripts/check_test_placeholders.py
