name: CI Pipeline

on:
  push:
    branches: [main, 'feature/**', 'fix/**', 'test/**']
  pull_request:
    branches: [main]

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r server/requirements.txt -r server/requirements-dev.txt

      - name: Lint with Ruff
        run: |
          ruff check server/

      - name: Run Pytest
        run: |
          cd server
          python -m pytest --cov=app --cov-report=term-missing --junitxml=junit.xml

      - name: Upload Pytest report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pytest-results
          path: server/junit.xml

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read .nvmrc
        id: nvm
        run: echo "NODE_VERSION=$(cat .nvmrc)" >> $GITHUB_OUTPUT

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.nvm.outputs.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: |
          cd client
          npm ci

      - name: Lint with ESLint
        run: |
          cd client
          npm run lint

      - name: Run Vitest
        run: |
          cd client
          npm test

      - name: Production Build
        run: |
          cd client
          npm run build

  pending-tests:
    name: pending-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check Pending Test Placeholders
        run: |
          python scripts/check_test_placeholders.py

